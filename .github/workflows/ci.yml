name: Indigo Backend CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Job 1: Lint and format check ──────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # ── Job 2: Unit tests (no database needed) ────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test unit
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/indigo

  # ── Job 3: Integration + API tests (with database) ────────────
  integration-tests:
    name: Integration & API Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER:     postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB:       indigo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres

      - name: Run migrations
        run: sqlx migrate run
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/indigo

      - name: Run integration tests
        run: cargo test integration
        env:
          DATABASE_URL:  postgres://postgres:postgres@localhost:5432/indigo
          REDIS_URL:     redis://127.0.0.1:6379
          JWT_SECRET:    ci-test-secret
          FRONTEND_URL:  http://localhost:4200

      - name: Run API tests
        run: cargo test api
        env:
          DATABASE_URL:  postgres://postgres:postgres@localhost:5432/indigo
          REDIS_URL:     redis://127.0.0.1:6379
          JWT_SECRET:    ci-test-secret
          FRONTEND_URL:  http://localhost:4200

  # ── Job 4: Build release binary ───────────────────────────────
  build:
    name: Build Release
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, integration-tests]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/indigo

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: indigo-backend
          path: target/release/indigo
          retention-days: 7

  # ── Job 5: Docker build and push ──────────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context:   .
          file:      Dockerfile.backend
          push:      true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/indigo-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/indigo-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── Job 6: Deploy to production ───────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host:     ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/indigo
            docker pull ${{ secrets.DOCKER_USERNAME }}/indigo-backend:latest
            docker compose down
            docker compose up -d
            echo "✅ Indigo backend deployed successfully"